name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - name: set up JDK 8
      uses: actions/setup-java@v6
      with:
        distribution: temurin   # required since setup-java v2
        java-version: '8'
